name: CI

# Pre-merge quality gate for oc-docs. Vercel handles production deploys
# on push to main; this workflow runs the checks Vercel doesn't
# (type-check, format, lint, build). Critical for the docs site since
# Phase 3.5 auto-PRs from oc-packages release tags land MDX changes
# here that should pass type-check + build before merging.

# main takes changes only through its merge queue, which runs these jobs on
# the exact commit main then moves to, so a push to main needs no run of its own.
on:
    pull_request:
        branches: [main]
    merge_group:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            # Every commit in the history, scanned for secrets.
            - name: No secrets in the history (gitleaks 8.30.1, pinned by sha256)
              run: |
                  curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
                  tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
                  "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-level warn

            # A path into someone's home directory names a person in a public
            # repo and works on one machine only.
            - name: No absolute home-directory paths
              run: |
                  if git grep -nIE '(^|[^A-Za-z0-9_.:/-])/(Users|home)/[A-Za-z0-9_.-]+/' -- . ':!*.lock'; then
                      echo "::error::absolute home-directory path in a tracked file"
                      exit 1
                  fi

            - uses: actions/setup-node@v5
              with:
                  # Node 22 — chevrotain (transitive dep) requires >=22
                  node-version: '24'
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Type check
              run: yarn type-check

            - name: Format check
              run: yarn format:check

            - name: Lint
              run: yarn lint

            # moved-pages.test.ts compares the pages with the commit main was at.
            - name: Test
              run: yarn test:run
              env:
                  DOCS_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}

            - name: Internal links
              run: yarn check:internal-links

            - name: Nostr kinds match the registry
              run: yarn check:kinds

            - name: Code-sample imports against published packages
              run: yarn check:sample-imports

            # Every unmarked code block compiles against the published packages.
            - name: Code samples compile against published packages
              run: yarn check:snippets

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  # Node 22 — chevrotain (transitive dep) requires >=22
                  node-version: '24'
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build
