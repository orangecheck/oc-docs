name: CI

# Pre-merge quality gate for oc-docs. Vercel handles production deploys
# on push to main; this workflow runs the checks Vercel doesn't
# (type-check, format, lint, build). Critical for the docs site since
# Phase 3.5 auto-PRs from oc-packages release tags land MDX changes
# here that should pass type-check + build before merging.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Code Quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # A path into someone's home directory names a person in a public
            # repo and works on one machine only.
            - name: No absolute home-directory paths
              run: |
                  if git grep -nIE '(^|[^A-Za-z0-9_.:/-])/(Users|home)/[A-Za-z0-9_.-]+/' -- . ':!*.lock'; then
                      echo "::error::absolute home-directory path in a tracked file"
                      exit 1
                  fi

            - uses: actions/setup-node@v5
              with:
                  # Node 22 — chevrotain (transitive dep) requires >=22
                  node-version: '24'
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Type check
              run: yarn type-check

            - name: Format check
              run: yarn format:check

            - name: Lint
              run: yarn lint

            - name: Test
              run: yarn test:run

            - name: Internal links
              run: yarn check:internal-links

            - name: Nostr kinds match the registry
              run: yarn check:kinds

            - name: Code-sample imports against published packages
              run: yarn check:sample-imports

            # Every unmarked code block compiles against the published packages.
            - name: Code samples compile against published packages
              run: yarn check:snippets

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  # Node 22 — chevrotain (transitive dep) requires >=22
                  node-version: '24'
                  cache: 'yarn'

            - name: Install
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

    # Renovate cannot read check runs, so it cannot tell whether CI passed.
    # This job can: it runs only after the gating jobs above succeed.
    merge-renovate:
        name: Merge family bump
        needs: [quality, build]
        if: github.event_name == 'pull_request' && github.head_ref == 'renovate/@orangecheck-(family)'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Rebase-merge the PR
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh pr merge ${{ github.event.pull_request.number }} --rebase --repo ${{ github.repository }}
